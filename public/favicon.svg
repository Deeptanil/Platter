<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1438"/>
      <stop offset="100%" stop-color="#0D0B1E"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D7BFF"/>
      <stop offset="100%" stop-color="#6C3BF5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#6C3BF5" stroke-width="10"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="130" fill="#8B5CF6" opacity="0.25" filter="url(#glow)"/>

  <!-- Platter Cloche Dome -->
  <path d="M 136 345 A 120 120 0 0 1 376 345 Z" fill="#FFFFFF"/>
  <path d="M 148 340 A 108 108 0 0 1 364 340" fill="none" stroke="#C4B5FD" stroke-width="8" stroke-linecap="round"/>

  <!-- Handle -->
  <circle cx="256" cy="210" r="18" fill="#FFFFFF" stroke="#9D7BFF" stroke-width="6"/>

  <!-- Platter Serving Base -->
  <rect x="106" y="348" width="300" height="28" rx="14" fill="url(#violetGrad)"/>
  <rect x="136" y="376" width="240" height="18" rx="9" fill="#6C3BF5"/>

  <!-- Steam Whisps -->
  <path d="M 210 170 Q 220 145 205 125" fill="none" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 256 160 Q 268 130 252 105" fill="none" stroke="#C4B5FD" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <path d="M 302 170 Q 312 145 297 125" fill="none" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
</svg>

